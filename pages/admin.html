<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理后台 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>🛡️ 管理后台</h1>
    <p>线索审核 · 紧急求助优先推送 · 领养全流程审核（背景核验 / 签约 / 回访计划）· 公益积分发放</p>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="filter-bar" style="border:1px solid var(--gray-200);border-radius:12px 12px 0 0">
    <span class="chip on" data-t="review">📋 线索审核</span>
    <span class="chip" data-t="urgent">🚨 紧急求助</span>
    <span class="chip" data-t="adoption">🐾 领养审核</span>
    <span class="chip" data-t="points">⭐ 积分发放</span>
  </div>
  <div id="pane" style="background:#fff;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 12px 12px;padding:16px"></div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, S = window.ZZStore;
  let animals = [], apps = [], tab = (location.hash || '').replace('#', '') || 'review';

  async function load() {
    animals = await S.animals();
    apps = await S.applications();
    renderStats();
    render();
  }

  function renderStats() {
    const pending = animals.filter(a => !a.reviewed);
    const urgent = pending.filter(a => a.urgent);
    const todo = apps.filter(a => a.stage === 0 || a.stage === 1);
    const signed = apps.filter(a => a.stage === 4);
    const stat = window.ZZChain.stats();
    document.getElementById('statGrid').innerHTML = [
      ['待审核线索', pending.length, '普通：' + (pending.length - urgent.length)],
      ['紧急待处理', urgent.length, '重伤 / 病危优先'],
      ['待审领养申请', todo.length, '需背景核验 + 审核'],
      ['已签约待回访', signed.length, '需录入回访记录'],
      ['链上区块高度', stat.height, '驱动：' + (stat.driver === 'fisco' ? 'FISCO BCOS' : '内置链')],
      ['积分发放总量', stat.pointsSupply, '公益积分']
    ].map(([k, v, s]) => '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>').join('');
  }

  function animalRow(a) {
    return '<div class="item-card' + (a.urgent ? ' urgent' : '') + '">' +
      (a.meta.thumb ? '<img class="thumb" src="' + a.meta.thumb + '" alt="">' : '') +
      '<div class="item-main">' +
        '<div class="item-title">#' + a.id + ' ' + esc(a.title) +
          (a.urgent ? ' <span class="tag tag-urgent">紧急</span>' : '') +
          ' <span class="tag tag-orange">' + a.severityText + '</span>' +
          ' <span class="tag">' + a.statusText + '</span></div>' +
        '<div class="muted">' + esc(a.meta.desc || '') + '</div>' +
        '<div class="item-meta"><span>📍' + esc(a.addressText) + '</span><span>👤' + esc(a.reporterName) + '</span>' +
          '<span>🕒' + a.timeText + '</span><span>☎️' + esc(a.meta.contact || '—') + '</span></div>' +
        L.hashRow('存证哈希', a.dataHash) +
        '<div class="btn-row" style="margin-top:8px">' +
          '<button class="btn btn-primary btn-sm" data-ok="' + a.id + '">✅ 审核通过</button>' +
          '<button class="btn btn-danger btn-sm" data-no="' + a.id + '">❌ 驳回</button>' +
          '<button class="btn btn-sm" data-in="' + a.id + '">🏠 通过并标记入站</button>' +
          L.navBtn(a.lng, a.lat, a.title) +
          '<a class="btn btn-sm" href="animals.html?id=' + a.id + '">档案</a>' +
        '</div>' +
      '</div></div>';
  }

  function appRow(app) {
    const o = [];
    if (app.stage === 0 || app.stage === 1) {
      o.push('<button class="btn btn-sm" data-bg="' + app.id + '">🔎 录入背景核验</button>');
      o.push('<button class="btn btn-primary btn-sm" data-ap="' + app.id + '">✅ 审核通过</button>');
      o.push('<button class="btn btn-danger btn-sm" data-rj="' + app.id + '">❌ 驳回</button>');
    }
    if (app.stage === 2) o.push('<button class="btn btn-primary btn-sm" data-sg="' + app.id + '">📝 领养签约</button>');
    if (app.stage === 4) {
      o.push('<button class="btn btn-sm" data-vs="' + app.id + '">📅 录入回访记录</button>');
      o.push('<button class="btn btn-primary btn-sm" data-cp="' + app.id + '">🎉 回访达标·完成领养</button>');
      o.push('<button class="btn btn-danger btn-sm" data-ab="' + app.id + '">⚠️ 标记弃养违约</button>');
    }
    return '<div class="card" style="margin-bottom:12px">' +
      '<h3>申请 #' + app.id + ' · ' + esc(app.animal ? app.animal.title : '#' + app.animalId) +
      ' <span class="tag tag-' + (app.stage === 3 || app.stage === 6 ? 'red' : app.stage === 5 ? 'green' : 'blue') + '">' + app.stageText + '</span></h3>' +
      '<div class="muted">申请人：' + esc(app.applicantName) + ' · 提交于 ' + app.createdText + '</div>' +
      '<div class="muted">📝 申请表：' + esc(JSON.stringify(app.form)) + '</div>' +
      L.hashRow('申请表哈希', app.formHash) +
      (app.bgCheckHash ? '<div class="muted">🔎 背景核验：' + (app.bgPassed ? '通过' : '未通过') + ' · ' + esc(app.bgNote) + '</div>' +
        L.hashRow('核验哈希', app.bgCheckHash) : '') +
      (app.visitPlan ? '<div class="muted">📅 回访计划：' + esc(app.visitPlan) + '</div>' : '') +
      (app.rejectReason ? '<div class="muted" style="color:#dc2626">驳回理由：' + esc(app.rejectReason) + '</div>' : '') +
      (app.contractHash ? L.hashRow('协议哈希', app.contractHash) : '') +
      (app.visits.length ? '<div class="muted">回访 ' + app.visits.length + ' 次：' +
        app.visits.map(v => '第' + v.round + '次' + (v.passed ? '✅' : '⚠️')).join(' / ') + '</div>' : '') +
      '<div class="btn-row" style="margin-top:10px">' + o.join('') + '</div>' +
    '</div>';
  }

  function render() {
    const pane = document.getElementById('pane');
    if (tab === 'review') {
      const list = animals.filter(a => !a.reviewed).sort((x, y) =>
        (y.urgent ? 1 : 0) - (x.urgent ? 1 : 0) || y.severity - x.severity || x.createdAt - y.createdAt);
      pane.innerHTML = '<div class="muted" style="margin-bottom:10px">按「紧急 → 严重程度 → 上报时间」排序，共 ' + list.length + ' 条待审核</div>' +
        (list.length ? list.map(animalRow).join('') : '<div class="empty">🎉 没有待审核线索</div>');
    } else if (tab === 'urgent') {
      const list = animals.filter(a => a.urgent);
      pane.innerHTML = '<div class="muted" style="margin-bottom:10px">重伤 / 病危动物，管理员需优先审核并派单；共 ' + list.length + ' 条</div>' +
        (list.length ? list.map(animalRow).join('') : '<div class="empty">暂无紧急求助</div>');
    } else if (tab === 'adoption') {
      const order = { 0: 0, 1: 1, 2: 2, 4: 3, 3: 4, 6: 4, 5: 5 };
      const list = apps.slice().sort((a, b) => (order[a.stage] || 9) - (order[b.stage] || 9));
      pane.innerHTML = '<div class="muted" style="margin-bottom:10px">按处理优先级排序：待核验 → 待审核 → 待签约 → 回访中</div>' +
        (list.length ? list.map(appRow).join('') : '<div class="empty">暂无领养申请</div>');
    } else {
      pane.innerHTML =
        '<div class="card" style="max-width:560px"><h3>⭐ 发放公益积分</h3>' +
        '<div class="field" style="margin-bottom:8px"><label>账户</label><select id="p_addr">' +
          window.ZZAuth.accounts.map(a => '<option value="' + a.addr + '">' + esc(a.name) + '</option>').join('') +
        '</select></div>' +
        '<div class="field" style="margin-bottom:8px"><label>事由</label><select id="p_reason">' +
          Object.keys(window.ZZ_CONFIG.POINT_REASON).map(k => '<option value="' + k + '">' + window.ZZ_CONFIG.POINT_REASON[k] + '</option>').join('') +
          '<option value="MANUAL">管理员手动发放</option></select></div>' +
        '<div class="field" style="margin-bottom:8px"><label>数量</label><input id="p_amount" type="number" value="10"></div>' +
        '<button class="btn btn-primary" id="p_send">发放（上链）</button></div>' +
        '<div class="section-title">🏆 积分排行</div><div id="p_board"></div>';
      document.getElementById('p_send').onclick = async () => {
        await S.awardPoints(document.getElementById('p_addr').value,
          document.getElementById('p_amount').value, document.getElementById('p_reason').value);
        L.toast('积分已发放并上链'); await load();
      };
      S.leaderboard().then(rows => {
        document.getElementById('p_board').innerHTML = '<div class="table-wrap"><table class="table"><tr><th>#</th><th>账户</th><th>可用积分</th><th>累计获得</th></tr>' +
          rows.map(r => '<tr><td>' + r.rank + '</td><td>' + esc(r.name) + '<div style="font-size:11px;color:var(--gray-400)">' + r.addr + '</div></td>' +
            '<td><b>' + r.points + '</b></td><td>' + r.earned + '</td></tr>').join('') + '</table></div>';
      });
    }
    bind();
  }

  function bind() {
    document.querySelectorAll('[data-ok]').forEach(el => el.onclick = async () => {
      await S.reviewAnimal(Number(el.dataset.ok), true, '管理员现场核实通过');
      L.toast('审核通过并上链，已通知上报人'); await load();
    });
    document.querySelectorAll('[data-no]').forEach(el => el.onclick = async () => {
      const r = await L.prompt('驳回理由（将上链存证并通知上报人）：', '信息不全，无法核实');
      if (!r) return;
      await S.reviewAnimal(Number(el.dataset.no), false, r);
      L.toast('已驳回并上链'); await load();
    });
    document.querySelectorAll('[data-in]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.in);
      await S.reviewAnimal(id, true, '管理员核实通过');
      await S.setStatus(id, 2, '已送入救助站');
      L.toast('已审核通过并标记入站'); await load();
    });
    document.querySelectorAll('[data-bg]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.bg);
      const note = await L.prompt('背景核验结论（住房、家庭意见、既往饲养记录）：', '住房稳定，家庭成员同意');
      if (note === null) return;
      await S.bgCheck(id, true, note);
      L.toast('背景核验已上链'); await load();
    });
    document.querySelectorAll('[data-ap]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.ap);
      const plan = await L.prompt('回访计划（例：首月每周 1 次，之后每月 1 次，共 6 次）：', '首月每周 1 次，之后每月 1 次，共 6 次');
      if (plan === null) return;
      await S.reviewApplication(id, true, '', plan);
      L.toast('审核通过，已通知申请人签约'); await load();
    });
    document.querySelectorAll('[data-rj]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.rj);
      const r = await L.prompt('驳回理由（将上链并通知申请人）：', '暂不具备饲养条件');
      if (!r) return;
      await S.reviewApplication(id, false, r, '');
      L.toast('已驳回并上链'); await load();
    });
    document.querySelectorAll('[data-sg]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.sg);
      if (!await L.confirm('确认签署领养协议？签署后托管权将移交领养人并写入链上。')) return;
      await S.sign(id);
      L.toast('领养协议已签约，托管权移交上链'); await load();
    });
    document.querySelectorAll('[data-vs]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.vs);
      const note = await L.prompt('回访情况记录：', '精神状态良好，饮食正常');
      if (note === null) return;
      await S.addVisit(id, note, true);
      L.toast('回访记录已上链'); await load();
    });
    document.querySelectorAll('[data-cp]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.cp);
      await S.completeAdoption(id);
      L.toast('领养流程完成'); await load();
    });
    document.querySelectorAll('[data-ab]').forEach(el => el.onclick = async () => {
      const id = Number(el.dataset.ab);
      const r = await L.prompt('弃养违约说明（将扣减积分并把动物重新置为待领养）：', '经多次联系未配合回访，确认弃养');
      if (!r) return;
      await S.flagAbandon(id, r);
      L.toast('已标记弃养违约并写入链上'); await load();
    });
  }

  document.querySelectorAll('.chip[data-t]').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-t]').forEach(x => x.classList.remove('on'));
    el.classList.add('on'); tab = el.dataset.t; render();
  }));

  if (!window.ZZAuth.canReview()) {
    L.toast('当前身份为普通用户，切换为管理员/救助站可体验审核功能', 'err');
  }

  await load();
};
</script>
<script>ZZLayout.boot({ active: 'admin', title: '管理后台' });</script>
</body>
</html>
