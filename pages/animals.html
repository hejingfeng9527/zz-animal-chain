<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动物档案 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>🐾 动物档案与流转记录</h1>
    <p>从「救助站 → 领养人」的每一次状态变更、托管权转移都写入链上，永久留存，防止弃养导致的二次流浪</p>
  </div>

  <div class="grid grid-main">
    <div>
      <div class="filter-bar" style="border:1px solid var(--gray-200);border-radius:12px 12px 0 0">
        <span class="chip on" data-s="all">全部</span>
        <span class="chip" data-s="pending">待审核</span>
        <span class="chip" data-s="urgent">🚨 紧急</span>
        <span class="chip" data-s="4">待领养</span>
        <span class="chip" data-s="5">已领养</span>
        <span class="chip" data-s="3">救治中</span>
      </div>
      <div class="list" id="list" style="background:#fff;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 12px 12px;padding:12px"></div>
    </div>
    <div>
      <div class="card" id="detail"><div class="empty">← 选择左侧任一档案查看完整链路</div></div>
    </div>
  </div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, S = window.ZZStore;
  let animals = [], apps = [], filter = 'all';

  async function load() {
    animals = await S.animals();
    apps = await S.applications();
    renderList();
  }

  function match(a) {
    if (filter === 'all') return true;
    if (filter === 'pending') return !a.reviewed;
    if (filter === 'urgent') return a.urgent;
    return String(a.status) === filter;
  }

  function renderList() {
    const list = animals.filter(match).slice().reverse();
    document.getElementById('list').innerHTML = list.length ? list.map(a =>
      '<div class="item-card' + (a.urgent ? ' urgent' : '') + '" data-id="' + a.id + '" style="cursor:pointer">' +
        (a.meta.thumb ? '<img class="thumb" src="' + a.meta.thumb + '" alt="">' : '') +
        '<div class="item-main">' +
          '<div class="item-title">#' + a.id + ' ' + esc(a.title) +
            (a.urgent ? ' <span class="tag tag-urgent">紧急</span>' : '') +
            ' <span class="tag tag-' + (a.status === 4 ? 'green' : a.status === 5 ? 'blue' : 'orange') + '">' + a.statusText + '</span>' +
            (a.severity ? ' <span class="tag tag-orange">' + a.severityText + '</span>' : '') +
            (!a.reviewed ? ' <span class="tag tag-red">待审核</span>' : '') + '</div>' +
          '<div class="item-meta"><span>📍' + esc(a.addressText) + '</span><span>👤' + esc(a.reporterName) + '</span><span>' + a.timeText + '</span></div>' +
        '</div>' +
      '</div>').join('') : '<div class="empty">没有符合条件的档案</div>';

    document.querySelectorAll('#list .item-card').forEach(el =>
      el.addEventListener('click', () => open(Number(el.dataset.id))));
  }

  async function open(id) {
    const a = await S.animal(id);
    if (!a) return;
    const related = apps.filter(x => x.animalId === id);
    const v = await S.verifyAnimal(a);
    const me = window.ZZAuth.current();
    const canManage = me.role === 'admin' || me.role === 'shelter';

    const transfers = (a.transfers || []).map(t =>
      '<li><div class="tl-title">' + window.ZZ_CONFIG.STATUS[t.fromStatus] + ' → <b>' + window.ZZ_CONFIG.STATUS[t.toStatus] + '</b></div>' +
      '<div class="tl-meta">' + esc(t.note || '—') + '</div>' +
      '<div class="tl-meta">托管方：' + esc(window.ZZAuth.nameOf(t.from)) + ' → ' + esc(window.ZZAuth.nameOf(t.to)) + ' · 操作者：' + esc(window.ZZAuth.nameOf(t.operator)) + ' · ' + S.fmtTs(t.ts) + '</div>' +
      (t.evidenceHash ? L.hashRow('凭证哈希', t.evidenceHash) : '') + '</li>').join('');

    const statusOpts = [[2, '已入站'], [3, '救治中'], [4, '待领养'], [6, '已放归'], [7, '已死亡']]
      .map(([v2, t]) => '<option value="' + v2 + '">' + t + '</option>').join('');

    const acctOpts = window.ZZAuth.accounts
      .map(x => '<option value="' + x.addr + '">' + esc(x.name) + '</option>').join('');

    document.getElementById('detail').innerHTML =
      '<h3>#' + a.id + ' ' + esc(a.title) + (a.urgent ? ' <span class="tag tag-urgent">紧急</span>' : '') + '</h3>' +
      (a.meta.thumb ? '<img src="' + a.meta.thumb + '" style="width:100%;border-radius:10px;margin-bottom:10px" alt="">' : '') +
      '<div class="item-meta" style="margin-bottom:8px">' +
        '<span class="tag tag-' + (a.status === 4 ? 'green' : a.status === 5 ? 'blue' : 'orange') + '">' + a.statusText + '</span>' +
        '<span class="tag">' + a.severityText + '</span><span>' + esc(a.species) + '</span></div>' +
      '<div class="muted" style="margin-bottom:8px">' + esc(a.meta.desc || '') + '</div>' +
      '<div class="muted">📍 ' + esc(a.addressText) + '　👤 上报：' + esc(a.reporterName) + '　🕒 ' + a.timeText + '</div>' +
      '<div class="muted">🏠 收容方：' + esc(a.shelterName) + '　🤝 领养人：' + esc(a.guardianName) + '</div>' +
      '<div style="margin:10px 0">' + L.navBtn(a.lng, a.lat, a.title) + '</div>' +
      '<div class="card" style="background:var(--gray-50);margin:12px 0">' +
        '<b>🔐 线索哈希存证</b>' + L.hashRow('链上哈希', a.dataHash) +
        '<div id="verifyBox" class="muted" style="font-size:12px"></div>' +
        '<button class="btn btn-sm" id="verifyBtn">校验原文是否被篡改</button>' +
      '</div>' +
      (a.review ? '<div class="muted">📋 审核：' + (a.review.approved ? '通过' : '驳回') +
        ' · ' + esc(a.review.reason || '—') + ' · ' + esc(window.ZZAuth.nameOf(a.review.reviewer)) + '</div>' : '') +
      '<div class="section-title">🔗 链上流转记录（' + (a.transfers || []).length + '）</div>' +
      (transfers ? '<ul class="timeline">' + transfers + '</ul>' : '<div class="empty">暂无流转记录</div>') +
      (related.length ? '<div class="section-title">📄 关联领养申请</div>' + related.map(x =>
        '<div class="muted">#' + x.id + ' ' + esc(x.applicantName) + ' · <span class="tag">' + x.stageText + '</span> ' +
        '<a href="adoption.html#mine">查看</a></div>').join('') : '') +
      (canManage ? '<div class="section-title">⚙️ 管理员操作</div>' +
        (a.reviewed ? '' :
          '<div class="btn-row" style="margin-bottom:8px">' +
            '<button class="btn btn-primary btn-sm" id="okBtn">✅ 审核通过</button>' +
            '<button class="btn btn-danger btn-sm" id="noBtn">❌ 驳回</button></div>') +
        '<div class="field" style="margin-bottom:8px"><label>状态流转（凭证将生成哈希上链）</label>' +
          '<div class="btn-row"><select id="stSel">' + statusOpts + '</select>' +
          '<input id="stNote" placeholder="说明，如：已送医" style="flex:1;min-width:120px">' +
          '<input type="file" id="stFile" style="max-width:180px">' +
          '<button class="btn btn-sm btn-primary" id="stBtn">更新状态</button></div></div>' +
        '<div class="field"><label>托管权转移（站间转运 / 移交领养人）</label>' +
          '<div class="btn-row"><select id="toSel">' + acctOpts + '</select>' +
          '<select id="toStatus"><option value="2">已入站</option><option value="4">待领养</option><option value="5">已领养</option></select>' +
          '<button class="btn btn-sm" id="trBtn">转移并上链</button></div></div>'
        : (a.status === 4 ? '<div class="section-title">🐾 我想领养</div><a class="btn btn-primary" href="adoption.html?animal=' + a.id + '">提交领养申请</a>' : ''));

    // 事件绑定
    const vb = document.getElementById('verifyBtn');
    if (vb) vb.onclick = async () => {
      const r = await S.verifyAnimal(a);
      document.getElementById('verifyBox').innerHTML = r.match
        ? '✅ 校验通过：重新计算的哈希与链上一致，线索未被篡改。<br><code style="font-size:11px">' + r.recomputed + '</code>'
        : '⚠️ 哈希不一致！链上：' + r.onchain + ' 重新计算：' + r.recomputed;
    };
    const okB = document.getElementById('okBtn');
    if (okB) okB.onclick = async () => {
      await S.reviewAnimal(a.id, true, '现场核实，情况属实');
      L.toast('审核已通过并上链'); await load(); await open(a.id);
    };
    const noB = document.getElementById('noBtn');
    if (noB) noB.onclick = async () => {
      const reason = await L.prompt('填写驳回理由（将上链存证）：', '与已有线索重复');
      if (!reason) return;
      await S.reviewAnimal(a.id, false, reason);
      L.toast('已驳回并上链'); await load(); await open(a.id);
    };
    const stB = document.getElementById('stBtn');
    if (stB) stB.onclick = async () => {
      const file = document.getElementById('stFile').files[0];
      await S.setStatus(a.id, document.getElementById('stSel').value, document.getElementById('stNote').value, file);
      L.toast('状态已更新并上链'); await load(); await open(a.id);
    };
    const trB = document.getElementById('trBtn');
    if (trB) trB.onclick = async () => {
      await S.transfer(a.id, document.getElementById('toSel').value, document.getElementById('toStatus').value, '托管权转移');
      L.toast('托管权已转移并上链'); await load(); await open(a.id);
    };
  }

  document.querySelectorAll('.chip[data-s]').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-s]').forEach(x => x.classList.remove('on'));
    el.classList.add('on'); filter = el.dataset.s; renderList();
  }));

  await load();
  const q = new URLSearchParams(location.search).get('id');
  if (q) await open(Number(q));
};
</script>
<script>ZZLayout.boot({ active: 'animals', title: '动物档案' });</script>
</body>
</html>
