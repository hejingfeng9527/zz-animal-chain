<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上报线索 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>📢 上报需要帮助的流浪动物</h1>
    <p>线索原文将生成 SHA-256 存证哈希并写入区块链，任何篡改都可被校验发现。提交后进入管理员审核队列。</p>
  </div>

  <div class="grid grid-main">
    <div class="card">
      <h3>📝 线索信息</h3>
      <div class="form-grid">
        <div class="field full">
          <label>标题（例如：金水区花园路受伤橘猫）</label>
          <input id="title" placeholder="一句话描述你发现的动物" maxlength="60">
        </div>
        <div class="field">
          <label>物种</label>
          <select id="species"><option>猫</option><option>犬</option><option>其他</option></select>
        </div>
        <div class="field">
          <label>健康状况</label>
          <select id="severity">
            <option value="0">健康（待救助/待领养）</option>
            <option value="1">受伤</option>
            <option value="2">患病</option>
            <option value="3">重伤 / 病危（将标记为【紧急】）</option>
          </select>
        </div>
        <div class="field full">
          <label>发现地点（点击右侧地图选点，或手动填写）</label>
          <input id="addressText" placeholder="例如：金水区花园路与农业路交叉口">
        </div>
        <div class="field">
          <label>经度 lng</label>
          <input id="lng" value="113.676400">
        </div>
        <div class="field">
          <label>纬度 lat</label>
          <input id="lat" value="34.799300">
        </div>
        <div class="field full">
          <label>现场情况描述</label>
          <textarea id="desc" rows="3" placeholder="外观、伤情、是否亲人、有无项圈等"></textarea>
        </div>
        <div class="field">
          <label>联系方式</label>
          <input id="contact" placeholder="手机号 / 微信">
        </div>
        <div class="field">
          <label>标签（逗号分隔）</label>
          <input id="tags" placeholder="亲人, 已驱虫, 幼崽">
        </div>
        <div class="field full">
          <label>现场照片（可选，图片哈希将一并存证）</label>
          <input type="file" id="photo" accept="image/*">
          <span class="hint">图片仅本地压缩后存储，链上只写入哈希，不上传原图</span>
        </div>
      </div>
      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-primary" id="submitBtn">⛓️ 提交并上链存证</button>
        <button class="btn" id="hashBtn">🔍 预览存证哈希</button>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>📍 地图选点</h3>
        <div class="map-wrap"><div id="map" class="map-canvas" style="height:280px"></div></div>
        <div class="muted" style="margin-top:8px">点击地图选择发现位置，蓝色标记即当前坐标。</div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>🔐 存证预览</h3>
        <div class="muted">线索原文（规范化 JSON）：</div>
        <pre id="payloadView" style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap;max-height:180px;overflow:auto"></pre>
        <div class="hash-row"><span class="hk">SHA-256</span><code class="hv" id="hashView">—</code></div>
        <div class="muted" id="hashTip" style="font-size:11px"></div>
      </div>
    </div>
  </div>

  <div id="receipt"></div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc;
  let photoFile = null, photoHash = null, markerMode = true;

  const $ = (id) => document.getElementById(id);

  await window.ZZMap.init('map', { center: [Number($('lng').value), Number($('lat').value)], zoom: 14 });
  window.ZZMap.onClick(async (lng, lat) => {
    $('lng').value = lng.toFixed(6);
    $('lat').value = lat.toFixed(6);
    window.ZZMap.clear();
    window.ZZMap.add({ lng, lat, title: '发现点', icon: '📍', color: '#2563eb' });
    const addr = await window.ZZMap.regeo(lng, lat);
    if (addr && !$('addressText').value) $('addressText').value = addr;
    preview();
  });
  window.ZZMap.add({ lng: Number($('lng').value), lat: Number($('lat').value), title: '发现点', icon: '📍', color: '#2563eb' });

  async function payload() {
    return {
      species: $('species').value,
      title: $('title').value.trim(),
      addressText: $('addressText').value.trim(),
      lat: Number($('lat').value),
      lng: Number($('lng').value),
      severity: Number($('severity').value),
      desc: $('desc').value.trim(),
      contact: $('contact').value.trim(),
      tags: $('tags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      photoHash: photoHash || null
    };
  }

  async function preview() {
    const p = await payload();
    $('payloadView').textContent = window.ZZHash.canonical(p);
    const h = await window.ZZHash.hashRecord(p);
    $('hashView').textContent = h;
    $('hashTip').textContent = Number($('severity').value) >= 3
      ? '⚠️ 该线索将自动标记为【紧急】，管理员会优先审核并推送通知。'
      : '提交后该哈希将写入链上，任何人可用原文重新计算并比对。';
  }

  ['title', 'species', 'severity', 'addressText', 'lng', 'lat', 'desc', 'contact', 'tags']
    .forEach(id => $(id).addEventListener('input', preview));
  ['species', 'severity'].forEach(id => $(id).addEventListener('change', preview));

  $('photo').addEventListener('change', async (e) => {
    photoFile = e.target.files[0] || null;
    photoHash = photoFile ? await window.ZZHash.sha256Hex(photoFile) : null;
    preview();
  });

  $('hashBtn').addEventListener('click', () => { preview(); L.toast('已重新计算存证哈希'); });

  $('submitBtn').addEventListener('click', async () => {
    const p = await payload();
    if (!p.title) return L.toast('请填写标题', 'err');
    if (!p.addressText) return L.toast('请填写发现地点', 'err');
    $('submitBtn').disabled = true;
    $('submitBtn').textContent = '上链中…';
    try {
      const rc = await window.ZZStore.report(p, photoFile);
      L.toast('线索已上链，等待管理员审核');
      $('receipt').innerHTML = '<div class="card" style="margin-top:16px;border-color:#bbf7d0">' +
        '<h3>✅ 上链成功，等待管理员审核</h3>' +
        '<div class="muted">区块高度：#' + rc.blockNumber + ' · Gas 消耗：' + rc.gasUsed + '</div>' +
        L.hashRow('交易哈希', rc.txHash) +
        L.hashRow('线索存证', p.photoHash || rc.txHash) +
        '<div class="btn-row" style="margin-top:12px">' +
          '<a class="btn btn-primary" href="animals.html?id=' + rc.value + '">查看我的线索档案</a>' +
          '<a class="btn" href="explorer.html?tx=' + rc.txHash + '">在区块浏览器中查看</a>' +
          '<a class="btn" href="report.html">继续上报</a>' +
        '</div></div>';
      $('receipt').scrollIntoView({ behavior: 'smooth' });
    } catch (err) {
      L.toast('上链失败：' + err.message, 'err');
    } finally {
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = '⛓️ 提交并上链存证';
    }
  });

  preview();
};
</script>
<script>ZZLayout.boot({ active: 'report', title: '上报线索' });</script>
</body>
</html>
