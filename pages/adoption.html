<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领养中心 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>🐾 领养中心</h1>
    <p>领养申请提交、背景核验、领养签约、回访记录全部上链；托管权移交不可抵赖，杜绝弃养二次流浪</p>
  </div>

  <div id="applyBox"></div>

  <div class="section-title">🏠 可领养动物 <i class="line"></i></div>
  <div class="grid grid-3" id="adoptable"></div>

  <div class="section-title" id="mine">📄 我的领养申请 <i class="line"></i></div>
  <div class="list" id="myApps"></div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, S = window.ZZStore;
  let animals = [], apps = [], current = null;

  async function load() {
    animals = await S.animals();
    apps = await S.applications();
    renderAdoptable();
    renderMine();
  }

  function renderAdoptable() {
    const list = animals.filter(a => a.status === 4 && a.reviewed);
    document.getElementById('adoptable').innerHTML = list.length ? list.map(a =>
      '<div class="card">' +
        (a.meta.thumb ? '<img src="' + a.meta.thumb + '" style="width:100%;height:150px;object-fit:cover;border-radius:10px" alt="">' : '') +
        '<h3>' + esc(a.title) + '</h3>' +
        '<div class="muted">' + esc(a.meta.desc || '') + '</div>' +
        '<div class="item-meta" style="margin:6px 0"><span>📍' + esc(a.addressText) + '</span><span>' + a.severityText + '</span></div>' +
        '<div class="btn-row"><button class="btn btn-primary btn-sm" data-apply="' + a.id + '">提交领养申请</button>' +
          '<a class="btn btn-sm" href="animals.html?id=' + a.id + '">查看档案</a></div>' +
      '</div>').join('') : '<div class="empty">暂无可领养动物</div>';

    document.querySelectorAll('[data-apply]').forEach(el =>
      el.addEventListener('click', () => showForm(Number(el.dataset.apply))));
  }

  function stageFlow(app) {
    const steps = ['已提交', '背景核验', '审核通过', '已签约', '回访中', '已完成'];
    const idx = app.stage === 3 ? 1 : app.stage === 6 ? 0 : app.stage;
    return '<div class="item-meta" style="margin:6px 0">' + steps.map((s, i) =>
      '<span class="tag ' + (i <= idx ? 'tag-green' : '') + '">' + s + '</span>').join(' → ') + '</div>';
  }

  function renderMine() {
    const me = window.ZZAuth.current();
    const mine = apps.filter(x => x.applicant === me.addr).reverse();
    document.getElementById('myApps').innerHTML = mine.length ? mine.map(app =>
      '<div class="card">' +
        '<h3>申请 #' + app.id + ' · ' + esc(app.animal ? app.animal.title : '#' + app.animalId) +
        ' <span class="tag ' + (app.stage === 3 || app.stage === 6 ? 'tag-red' : app.stage === 5 ? 'tag-green' : 'tag-blue') + '">' + app.stageText + '</span></h3>' +
        stageFlow(app) +
        '<div class="muted">提交时间：' + app.createdText + '　签约时间：' + app.signedText + '</div>' +
        (app.stage === 3 ? '<div class="muted" style="color:#dc2626">驳回理由：' + esc(app.rejectReason) + '</div>' : '') +
        (app.visitPlan ? '<div class="muted">📅 回访计划：' + esc(app.visitPlan) + '</div>' : '') +
        (app.bgCheckHash ? L.hashRow('背景核验哈希', app.bgCheckHash) : '') +
        (app.bgNote ? '<div class="muted">核验结论：' + esc(app.bgNote) + '</div>' : '') +
        (app.contractHash ? L.hashRow('领养协议哈希', app.contractHash) : '') +
        (app.visits.length ? '<div class="section-title" style="margin:10px 0 6px">回访记录（' + app.visits.length + ' / 3）</div>' +
          '<ul class="timeline">' + app.visits.map(v =>
            '<li><div class="tl-title">第 ' + v.round + ' 次回访 · ' + (v.passed ? '✅ 通过' : '⚠️ 待整改') + '</div>' +
            '<div class="tl-meta">' + esc(v.note) + ' · ' + esc(window.ZZAuth.nameOf(v.recorder)) + ' · ' + S.fmtTs(v.ts) + '</div>' +
            L.hashRow('凭证哈希', v.evidenceHash) + '</li>').join('') + '</ul>' : '') +
      '</div>').join('') : '<div class="empty">你还没有提交领养申请</div>';
  }

  function showForm(animalId) {
    current = animals.find(a => a.id === animalId);
    document.getElementById('applyBox').innerHTML =
      '<div class="card" style="border-color:#bbf7d0">' +
        '<h3>📝 领养申请表 · ' + esc(current.title) + '</h3>' +
        '<div class="muted" style="margin-bottom:10px">表单内容将生成哈希上链，管理员审核后不可篡改</div>' +
        '<div class="form-grid">' +
          '<div class="field"><label>姓名</label><input id="f_name" value="小林"></div>' +
          '<div class="field"><label>联系电话</label><input id="f_phone" value="138xxxx0000"></div>' +
          '<div class="field"><label>居住区域</label><input id="f_area" value="金水区"></div>' +
          '<div class="field"><label>住房情况</label><select id="f_house"><option>自有住房</option><option>租房（房东同意）</option><option>集体宿舍</option></select></div>' +
          '<div class="field full"><label>饲养经验</label><input id="f_exp" value="首次养猫，已了解基本护理"></div>' +
          '<div class="field full"><label>家庭成员意见</label><input id="f_family" value="全家同意"></div>' +
          '<div class="field full"><label>承诺</label>' +
            '<label style="display:flex;gap:8px;align-items:center;font-weight:400">' +
            '<input type="checkbox" id="f_agree" checked style="width:auto"> 承诺不弃养、定期免疫驱虫、配合不少于 3 次回访，违约记录将上链</label></div>' +
        '</div>' +
        '<div class="btn-row" style="margin-top:12px">' +
          '<button class="btn btn-primary" id="f_submit">⛓️ 提交申请并上链</button>' +
          '<button class="btn" id="f_cancel">取消</button></div>' +
      '</div>';
    document.getElementById('applyBox').scrollIntoView({ behavior: 'smooth' });
    document.getElementById('f_cancel').onclick = () => { document.getElementById('applyBox').innerHTML = ''; };
    document.getElementById('f_submit').onclick = submitForm;
  }

  async function submitForm() {
    const form = {
      name: document.getElementById('f_name').value,
      phone: document.getElementById('f_phone').value,
      area: document.getElementById('f_area').value,
      house: document.getElementById('f_house').value,
      experience: document.getElementById('f_exp').value,
      family: document.getElementById('f_family').value,
      agree: document.getElementById('f_agree').checked,
      animalId: current.id
    };
    if (!form.agree) return L.toast('请先勾选领养承诺', 'err');
    try {
      const rc = await S.applyAdoption(current.id, form);
      L.toast('领养申请已上链，等待背景核验与审核');
      document.getElementById('applyBox').innerHTML =
        '<div class="card" style="border-color:#bbf7d0"><h3>✅ 申请已上链</h3>' +
        '<div class="muted">区块 #' + rc.blockNumber + ' · 申请编号 #' + rc.value + '</div>' +
        L.hashRow('交易哈希', rc.txHash) +
        '<div class="btn-row" style="margin-top:10px"><a class="btn btn-primary" href="#mine">查看我的申请</a>' +
        '<a class="btn" href="explorer.html?tx=' + rc.txHash + '">区块浏览器</a></div></div>';
      await load();
    } catch (e) { L.toast('提交失败：' + e.message, 'err'); }
  }

  await load();
  const q = new URLSearchParams(location.search).get('animal');
  if (q && animals.find(a => a.id === Number(q))) showForm(Number(q));
};
</script>
<script>ZZLayout.boot({ active: 'adoption', title: '领养中心' });</script>
</body>
</html>
