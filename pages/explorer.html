<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>链上存证 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>⛓️ 链上存证浏览器</h1>
    <p>区块 · 交易 · 事件日志 · 哈希校验：所有救助与领养行为均可溯源，内容一经上链不可篡改</p>
  </div>

  <div class="stat-grid" id="stat"></div>

  <div class="card" style="margin-bottom:16px">
    <h3>📜 已部署合约</h3>
    <div id="contracts"></div>
  </div>

  <div class="filter-bar" style="border:1px solid var(--gray-200);border-radius:12px 12px 0 0">
    <span class="chip on" data-t="blocks">🧱 区块</span>
    <span class="chip" data-t="txs">🔗 交易</span>
    <span class="chip" data-t="verify">🔐 存证校验</span>
  </div>
  <div id="pane" style="background:#fff;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 12px 12px;padding:16px"></div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, S = window.ZZStore, C = window.ZZChain;
  let tab = 'blocks';
  const q = new URLSearchParams(location.search).get('tx');

  function renderStat() {
    const s = C.stats();
    document.getElementById('stat').innerHTML = [
      ['区块高度', s.height, '最新区块'],
      ['交易总数', s.txCount, '含上链写操作'],
      ['动物档案', s.animalCount, 'AnimalRescueLedger'],
      ['领养申请', s.appCount, 'AdoptionLedger'],
      ['地图点位', s.poiCount, '救助站/医院/投喂点'],
      ['积分总量', s.pointsSupply, 'CharityPoints']
    ].map(([k, v, s2]) => '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s2 + '</div></div>').join('');
    const a = C.addresses();
    document.getElementById('contracts').innerHTML =
      ['CharityPoints 公益积分', 'AnimalRescueLedger 救助台账', 'AdoptionLedger 领养台账']
        .map((n, i) => L.hashRow(n, [a.charity, a.rescue, a.adoption][i])).join('');
  }

  function renderBlocks() {
    const blocks = C.blocks(60);
    document.getElementById('pane').innerHTML =
      '<div class="table-wrap"><table class="table"><tr><th>高度</th><th>时间</th><th>交易数</th><th>区块哈希</th><th>父哈希</th></tr>' +
      blocks.map(b => '<tr style="cursor:pointer" data-b="' + b.height + '"><td><b>#' + b.height + '</b></td>' +
        '<td>' + S.fmtTs(b.ts) + '</td><td>' + b.txCount + '</td>' +
        '<td><code>' + esc(window.ZZHash.shortHash(b.hash, 14, 10)) + '</code></td>' +
        '<td><code style="color:var(--gray-400)">' + esc(window.ZZHash.shortHash(b.parentHash, 12, 8)) + '</code></td></tr>').join('') +
      '</table></div>';
    document.querySelectorAll('[data-b]').forEach(el => el.onclick = () => {
      const b = C.blockAt(el.dataset.b);
      L.toast('区块 #' + b.height + '：' + b.txCount + ' 笔交易');
      tab = 'txs'; switchTab(); renderTxs(b.txs);
    });
  }

  function renderTxs(list) {
    const txs = list || C.recentTxs(80);
    document.getElementById('pane').innerHTML =
      '<div class="muted" style="margin-bottom:8px">共 ' + txs.length + ' 笔交易' + (list ? '（本区块）' : '（最新 80 笔）') + '</div>' +
      '<div class="table-wrap"><table class="table"><tr><th>交易哈希</th><th>合约</th><th>方法</th><th>发起方</th><th>区块</th><th>Gas</th></tr>' +
      txs.map(t => '<tr style="cursor:pointer" data-t="' + t.hash + '"><td><code>' + esc(window.ZZHash.shortHash(t.hash, 14, 8)) + '</code></td>' +
        '<td>' + t.contract + '</td><td><b>' + t.method + '</b></td>' +
        '<td>' + esc(window.ZZAuth.nameOf(t.from)) + '</td><td>#' + t.blockNumber + '</td><td>' + t.gasUsed + '</td></tr>').join('') +
      '</table></div>';
    document.querySelectorAll('[data-t]').forEach(el => el.onclick = () => showTx(el.dataset.t));
  }

  function showTx(hash) {
    const t = C.tx(hash);
    if (!t) return;
    const logs = (t.logs || []).map(l => '<li><div class="tl-title">' + l.event + ' <span class="tag">' + l.contract + '</span></div>' +
      '<div class="tl-meta"><code style="font-size:11px">' + esc(JSON.stringify(l.args)) + '</code></div></li>').join('');
    document.getElementById('pane').innerHTML =
      '<div class="card"><h3>🔗 交易详情</h3>' +
      L.hashRow('交易哈希', t.hash) +
      '<div class="muted">合约：' + t.contract + ' · 方法：<b>' + t.method + '</b></div>' +
      '<div class="muted">发起方：' + esc(window.ZZAuth.nameOf(t.from)) + ' · 区块：#' + t.blockNumber + ' · Gas：' + t.gasUsed + ' · ' + S.fmtTs(t.ts) + '</div>' +
      '<div class="section-title">入参</div><pre style="background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:10px;font-size:11px;white-space:pre-wrap">' +
        esc(JSON.stringify(t.args, null, 1)) + '</pre>' +
      '<div class="section-title">事件日志（' + (t.logs || []).length + '）</div>' +
      (logs ? '<ul class="timeline">' + logs + '</ul>' : '<div class="empty">无事件</div>') +
      '<div class="btn-row" style="margin-top:12px"><button class="btn btn-sm" id="back">← 返回列表</button></div></div>';
    document.getElementById('back').onclick = () => { renderTxs(); };
  }

  async function renderVerify() {
    const [animals, apps] = await Promise.all([S.animals(), S.applications()]);
    document.getElementById('pane').innerHTML =
      '<div class="card" style="max-width:720px"><h3>🔐 存证校验</h3>' +
      '<div class="muted" style="margin-bottom:10px">上传现场照片 / 输入线索原文，或粘贴哈希，系统会计算 SHA-256 并在链上检索匹配记录。若内容被篡改，哈希将不一致。</div>' +
      '<div class="field" style="margin-bottom:8px"><label>方式一：选择文件（照片 / 协议 / 凭证）</label>' +
        '<input type="file" id="v_file"></div>' +
      '<div class="field" style="margin-bottom:8px"><label>方式二：输入原文</label>' +
        '<textarea id="v_text" rows="2" placeholder="粘贴线索原文或任意文本"></textarea></div>' +
      '<div class="btn-row" style="margin-bottom:8px"><button class="btn btn-primary btn-sm" id="v_calc">计算 SHA-256</button></div>' +
      '<div class="hash-row"><span class="hk">计算结果</span><code class="hv" id="v_hash">—</code></div>' +
      '<div id="v_result" style="margin-top:10px"></div>' +
      '</div>';

    document.getElementById('v_calc').onclick = async () => {
      const f = document.getElementById('v_file').files[0];
      const txt = document.getElementById('v_text').value;
      const hash = f ? await window.ZZHash.sha256Hex(f)
        : (txt ? await window.ZZHash.sha256Hex(txt) : null);
      if (!hash) return L.toast('请先选择文件或输入文本', 'err');
      document.getElementById('v_hash').textContent = hash;

      const hits = [];
      for (const a of animals) {
        if (a.dataHash === hash) hits.push('🐾 动物档案 #' + a.id + '「' + esc(a.title) + '」的线索存证哈希');
        if (a.meta.photoHash === hash) hits.push('🖼️ 动物档案 #' + a.id + ' 的现场照片哈希');
        for (const t of (a.transfers || [])) {
          if (t.evidenceHash === hash) hits.push('🔗 档案 #' + a.id + ' 流转凭证（' + window.ZZ_CONFIG.STATUS[t.toStatus] + '）');
        }
      }
      for (const app of apps) {
        if (app.formHash === hash) hits.push('📝 领养申请 #' + app.id + ' 的申请表哈希');
        if (app.bgCheckHash === hash) hits.push('🔎 领养申请 #' + app.id + ' 的背景核验材料哈希');
        if (app.contractHash === hash) hits.push('📄 领养申请 #' + app.id + ' 的领养协议哈希');
        for (const v of app.visits) {
          if (v.evidenceHash === hash) hits.push('📅 领养申请 #' + app.id + ' 第 ' + v.round + ' 次回访凭证');
        }
      }
      document.getElementById('v_result').innerHTML = hits.length
        ? '<div class="card" style="background:#f0fdf4;border-color:#bbf7d0"><b>✅ 链上匹配成功</b><ul>' +
          hits.map(h => '<li>' + h + '</li>').join('') + '</ul></div>'
        : '<div class="card" style="background:#fffbeb;border-color:#fde68a">⚠️ 链上未检索到该哈希，可能尚未上链或内容已被修改。</div>';
    };
  }

  function switchTab() {
    document.querySelectorAll('.chip[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
  }

  document.querySelectorAll('.chip[data-t]').forEach(el => el.addEventListener('click', () => {
    tab = el.dataset.t; switchTab();
    if (tab === 'blocks') renderBlocks();
    else if (tab === 'txs') renderTxs();
    else renderVerify();
  }));

  renderStat();
  if (q) { tab = 'txs'; switchTab(); showTx(q); }
  else renderBlocks();
};
</script>
<script>ZZLayout.boot({ active: 'explorer', title: '链上存证' });</script>
</body>
</html>
