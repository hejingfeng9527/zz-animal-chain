<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公益积分 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>⭐ 公益积分</h1>
    <p>仅记录公益贡献，不涉及任何代币发行与资金转账；积分流水全部来自链上事件</p>
  </div>

  <div class="stat-grid" id="myStat"></div>

  <div class="grid grid-main">
    <div>
      <div class="section-title" style="margin-top:0">🏆 积分排行</div>
      <div class="table-wrap"><table class="table" id="board"></table></div>
    </div>
    <div>
      <div class="card">
        <h3>🧾 我的积分流水</h3>
        <div id="awards"></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3>📖 积分规则</h3>
        <div class="table-wrap"><table class="table">
          <tr><th>行为</th><th>积分</th></tr>
          <tr><td>上报线索核实通过</td><td>+10</td></tr>
          <tr><td>完成收容救助</td><td>+20</td></tr>
          <tr><td>完成领养签约</td><td>+50</td></tr>
          <tr><td>完成一次领养回访</td><td>+5</td></tr>
          <tr><td>回访达标·领养完成</td><td>+30</td></tr>
          <tr><td>弃养违约</td><td style="color:#dc2626">-30</td></tr>
        </table></div>
        <div class="muted" style="margin-top:8px;font-size:12px">
          积分由管理员/救助站根据链上行为发放，规则写在 <code>CharityPoints.sol</code>，
          发放记录以 <code>PointsAwarded</code> 事件永久留存。
        </div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, S = window.ZZStore;
  const me = window.ZZAuth.current();

  async function render() {
    const mine = await S.pointsOf(me.addr);
    const rows = await S.leaderboard();
    const stat = window.ZZChain.stats();

    document.getElementById('myStat').innerHTML = [
      ['我的可用积分', mine.balance, esc(me.name)],
      ['累计获得', mine.earned, '含已兑换/扣减前累计'],
      ['积分流水数', mine.awards.length, '链上事件'],
      ['全网发放总量', stat.pointsSupply, 'CharityPoints.totalSupply']
    ].map(([k, v, s]) => '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>').join('');

    document.getElementById('board').innerHTML =
      '<tr><th>#</th><th>账户</th><th>可用</th><th>累计</th></tr>' +
      rows.map(r => '<tr' + (r.addr === me.addr ? ' style="background:#f0fdf4"' : '') + '><td>' +
        (r.rank <= 3 ? ['🥇', '🥈', '🥉'][r.rank - 1] : r.rank) + '</td><td>' + esc(r.name) +
        '<div style="font-size:11px;color:var(--gray-400)">' + r.addr + '</div></td>' +
        '<td><b>' + r.points + '</b></td><td>' + r.earned + '</td></tr>').join('');

    document.getElementById('awards').innerHTML = mine.awards.length ?
      '<ul class="timeline">' + mine.awards.slice().reverse().map(a =>
        '<li class="' + (a.amount < 0 ? 'gray' : '') + '"><div class="tl-title">' +
          (a.amount < 0 ? '<span style="color:#dc2626">' + a.amount + '</span>' : '+' + a.amount) + ' 分 · ' +
          esc(window.ZZ_CONFIG.POINT_REASON[a.reason] || a.reason) + '</div>' +
        '<div class="tl-meta">操作者：' + esc(window.ZZAuth.nameOf(a.operator)) + ' · ' + S.fmtTs(a.ts) + '</div></li>').join('') + '</ul>'
      : '<div class="empty">暂无积分记录</div>';
  }

  await render();
};
</script>
<script>ZZLayout.boot({ active: 'points', title: '公益积分' });</script>
</body>
</html>
