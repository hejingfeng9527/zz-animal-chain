<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息中心 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>🔔 消息中心</h1>
    <p>审核结果、紧急求助推送、领养进度与回访提醒，全部由链上事件触发</p>
  </div>

  <div class="filter-bar" style="border:1px solid var(--gray-200);border-radius:12px 12px 0 0">
    <span class="chip on" data-t="all">全部</span>
    <span class="chip" data-t="review">✅ 审核结果</span>
    <span class="chip" data-t="urgent">🚨 紧急求助</span>
    <span class="chip" data-t="adoption">🐾 领养进度</span>
    <span class="chip" data-t="visit">📅 回访提醒</span>
    <span class="chip" data-t="points">⭐ 公益积分</span>
    <span style="flex:1"></span>
    <button class="btn btn-sm" id="readAll">全部标为已读</button>
    <button class="btn btn-sm btn-danger" id="clearAll">清空</button>
  </div>
  <div id="list" style="background:#fff;border:1px solid var(--gray-200);border-top:none;border-radius:0 0 12px 12px"></div>
</main>

<script src="../assets/js/hash.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/notify.js"></script>
<script src="../assets/js/chain.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/map.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc, N = window.ZZNotify;
  let type = 'all';

  function fmt(ms) {
    const d = new Date(ms), p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    const me = window.ZZAuth.current();
    let list = N.listFor(me.addr);
    if (type !== 'all') list = list.filter(m => m.type === type);
    document.getElementById('list').innerHTML = list.length ? list.map(m => {
      const t = N.TYPE[m.type] || N.TYPE.system;
      return '<div class="msg-item' + (m.read ? '' : ' unread') + '" data-id="' + m.id + '" data-link="' + (m.link || '') + '">' +
        '<div class="msg-icon">' + t.icon + '</div>' +
        '<div class="msg-body"><div class="msg-title">' + esc(m.title) + ' <span class="tag">' + t.label + '</span></div>' +
        '<div class="msg-text">' + esc(m.body) + '</div>' +
        '<div class="msg-time">' + fmt(m.ts) + (m.link ? ' · 点击查看相关页面' : '') + '</div></div>' +
        (m.read ? '' : '<button class="btn btn-sm" data-read="' + m.id + '">标为已读</button>') +
      '</div>';
    }).join('') : '<div class="empty">暂无消息</div>';

    document.querySelectorAll('[data-read]').forEach(el => el.onclick = (e) => {
      e.stopPropagation(); N.markRead(el.dataset.read); render();
    });
    document.querySelectorAll('.msg-item').forEach(el => el.onclick = () => {
      N.markRead(el.dataset.id);
      if (el.dataset.link) location.href = el.dataset.link;
      else render();
    });
  }

  document.querySelectorAll('.chip[data-t]').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-t]').forEach(x => x.classList.remove('on'));
    el.classList.add('on'); type = el.dataset.t; render();
  }));
  document.getElementById('readAll').onclick = () => { N.markAllRead(window.ZZAuth.current().addr); render(); };
  document.getElementById('clearAll').onclick = () => {
    if (confirm('确定清空当前身份的全部消息？')) { N.clear(window.ZZAuth.current().addr); render(); }
  };

  render();
};
</script>
<script>ZZLayout.boot({ active: 'messages', title: '消息中心' });</script>
</body>
</html>
