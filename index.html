<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地图导航 · 郑州流浪动物救助链</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="page-head">
    <h1>🗺️ 郑州流浪动物救助地图</h1>
    <p>流浪动物发现点 · 救助站 · 合作宠物医院 · 投喂点，一图尽览，一键导航</p>
  </div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="grid grid-main">
    <div>
      <div class="map-wrap">
        <div class="legend">
          <span><i class="dot" style="background:#dc2626"></i>紧急求助</span>
          <span><i class="dot" style="background:#f97316"></i>受伤/患病</span>
          <span><i class="dot" style="background:#16a34a"></i>待领养</span>
          <span><i class="dot" style="background:#64748b"></i>其他状态</span>
          <span><i class="dot" style="background:#2563eb"></i>救助站</span>
          <span><i class="dot" style="background:#0ea5e9"></i>宠物医院</span>
          <span><i class="dot" style="background:#a855f7"></i>投喂点</span>
        </div>
        <div class="filter-bar">
          <span class="chip on" data-f="all">全部动物</span>
          <span class="chip" data-f="injured">🩹 受伤/患病</span>
          <span class="chip" data-f="adoptable">🏠 待领养</span>
          <span class="chip" data-f="urgent">🚨 紧急求助</span>
          <span style="flex:1"></span>
          <span class="chip on" data-k="1">救助站</span>
          <span class="chip on" data-k="2">宠物医院</span>
          <span class="chip on" data-k="3">投喂点</span>
        </div>
        <div id="map" class="map-canvas"></div>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>📍 当前筛选结果 <span class="muted" id="countText"></span></h3>
        <div class="list" id="sideList" style="max-height:520px;overflow:auto"></div>
      </div>
    </div>
  </div>

  <div class="section-title">🏠 救助站与合作伙伴 <i class="line"></i></div>
  <div class="grid grid-3" id="poiGrid"></div>
</main>

<script src="assets/js/hash.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/notify.js"></script>
<script src="assets/js/chain.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/map.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
window.PAGE_INIT = async function () {
  const L = window.ZZLayout, esc = L.esc;
  const state = { filter: 'all', kinds: new Set(['1', '2', '3']) };
  let animals = [], pois = [];

  await window.ZZMap.init('map', { center: window.ZZ_CONFIG.city.center, zoom: window.ZZ_CONFIG.city.zoom });

  async function load() {
    animals = await window.ZZStore.animals();
    pois = await window.ZZStore.pois();
    renderStats();
    render();
    renderPois();
  }

  function renderStats() {
    const s = {
      total: animals.length,
      pending: animals.filter(a => !a.reviewed).length,
      urgent: animals.filter(a => a.urgent && a.status !== 5).length,
      adoptable: animals.filter(a => a.status === 4).length,
      adopted: animals.filter(a => a.status === 5).length,
      poi: pois.length
    };
    document.getElementById('statGrid').innerHTML = [
      ['在册动物档案', s.total, '链上永久留存'],
      ['待审核线索', s.pending, '管理员处理中'],
      ['紧急求助', s.urgent, '重伤/病危优先'],
      ['待领养', s.adoptable, '可提交领养申请'],
      ['已完成领养', s.adopted, '含回访记录'],
      ['地图点位', s.poi, '救助站/医院/投喂点']
    ].map(([k, v, s2]) => '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="s">' + s2 + '</div></div>').join('');
  }

  function animalColor(a) {
    if (a.urgent && a.status !== 5) return '#dc2626';
    if (a.severity === 1 || a.severity === 2) return '#f97316';
    if (a.status === 4) return '#16a34a';
    return '#64748b';
  }
  function animalIcon(a) {
    if (a.urgent) return '🚨';
    return a.species === '犬' ? '🐶' : a.species === '猫' ? '🐱' : '🐾';
  }
  function poiStyle(k) {
    return { 1: ['#2563eb', '🏠'], 2: ['#0ea5e9', '🏥'], 3: ['#a855f7', '🍚'], 0: ['#64748b', '📍'] }[k] || ['#64748b', '📍'];
  }

  function match(a) {
    if (state.filter === 'injured') return a.severity === 1 || a.severity === 2;
    if (state.filter === 'adoptable') return a.status === 4;
    if (state.filter === 'urgent') return a.urgent;
    return true;
  }

  function animalHtml(a) {
    return '<b>' + esc(a.title) + '</b>' +
      '<div class="iw-row">状态：' + a.statusText + ' · ' + a.severityText + (a.urgent ? ' · <b style="color:#dc2626">紧急</b>' : '') + '</div>' +
      '<div class="iw-row">' + esc(a.addressText) + '</div>' +
      '<div class="iw-row">上报人：' + esc(a.reporterName) + ' · ' + a.timeText + '</div>' +
      '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
        L.navBtn(a.lng, a.lat, a.title) +
        '<a class="btn btn-sm" href="pages/animals.html?id=' + a.id + '">查看档案</a>' +
        (a.status === 4 ? '<a class="btn btn-sm btn-primary" href="pages/adoption.html?animal=' + a.id + '">申请领养</a>' : '') +
      '</div>';
  }
  function poiHtml(p) {
    return '<b>' + esc(p.name) + '</b>' +
      '<div class="iw-row">' + p.kindText + ' · ' + esc(p.addressText) + '</div>' +
      '<div class="iw-row">联系：' + esc(p.contact || '—') + '</div>' +
      '<div style="margin-top:8px">' + L.navBtn(p.lng, p.lat, p.name) + '</div>';
  }

  function render() {
    const list = animals.filter(match);
    window.ZZMap.clear();
    list.forEach(a => window.ZZMap.add({
      id: 'a' + a.id, lng: a.lng, lat: a.lat, title: a.title,
      icon: animalIcon(a), color: animalColor(a), html: animalHtml(a)
    }));
    pois.filter(p => state.kinds.has(String(p.kind))).forEach(p => {
      const st = poiStyle(p.kind);
      window.ZZMap.add({ id: 'p' + p.id, lng: p.lng, lat: p.lat, title: p.name, icon: st[1], color: st[0], html: poiHtml(p) });
    });
    window.ZZMap.fit();

    document.getElementById('countText').textContent = '（' + list.length + ' 个动物点位）';
    document.getElementById('sideList').innerHTML = list.length ? list.slice(0, 60).map(a =>
      '<div class="item-card' + (a.urgent ? ' urgent' : '') + '">' +
        '<div class="item-main">' +
          '<div class="item-title">' + animalIcon(a) + ' ' + esc(a.title) +
            (a.urgent ? ' <span class="tag tag-urgent">紧急</span>' : '') +
            ' <span class="tag">' + a.statusText + '</span></div>' +
          '<div class="item-meta"><span>' + a.severityText + '</span><span>' + esc(a.addressText) + '</span><span>' + a.timeText + '</span></div>' +
        '</div>' +
        '<div class="item-actions">' + L.navBtn(a.lng, a.lat, a.title) +
          '<a class="btn btn-sm" href="pages/animals.html?id=' + a.id + '">档案</a></div>' +
      '</div>').join('') : '<div class="empty">当前筛选条件下没有点位</div>';
  }

  function renderPois() {
    document.getElementById('poiGrid').innerHTML = pois.map(p => {
      const st = poiStyle(p.kind);
      return '<div class="card"><h3>' + st[1] + ' ' + esc(p.name) + '</h3>' +
        '<div class="muted">' + p.kindText + ' · ' + esc(p.addressText) + '</div>' +
        '<div class="muted">联系：' + esc(p.contact || '—') + '</div>' +
        '<div style="margin-top:10px">' + L.navBtn(p.lng, p.lat, p.name) + '</div></div>';
    }).join('') || '<div class="empty">暂无点位</div>';
  }

  document.querySelectorAll('.chip[data-f]').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-f]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    state.filter = el.dataset.f;
    render();
  }));
  document.querySelectorAll('.chip[data-k]').forEach(el => el.addEventListener('click', () => {
    const k = el.dataset.k;
    if (state.kinds.has(k)) { state.kinds.delete(k); el.classList.remove('on'); }
    else { state.kinds.add(k); el.classList.add('on'); }
    render();
  }));

  await load();
};
</script>
<script>ZZLayout.boot({ active: 'index', title: '地图导航', map: true });</script>
</body>
</html>
